name: CI

# 为什么只有这一个 workflow：
# 之前这个项目**一次 CI 都没跑过**（没有 .github/），59 条单测全靠人工
# `gradle ... :app:testDebugUnitTest`。人工的必然结果是「想起来才跑」——
# 事实上出现过文档里写 tests=12 而实际 59 的偏差。
#
# 这里刻意把 assembleDebug / testDebugUnitTest / lintDebug 都跑上：
# - testDebugUnitTest 是唯一能防住「自愈逻辑被改坏」的闸门（Endpoint /
#   RecoveryPlanner / HandshakeHealGate / BackNavigationDecider 四个纯 JVM 类）；
# - assembleDebug 防住资源/manifest/BuildConfig 注入这类只在打包期暴露的错误
#   （踩过：`DEFAULT_LAN_URL` 引用了一个不存在的 BuildConfig 字段，
#   单测全绿但打包失败）；
# - lintDebug 的基线是 **0 error / 27 warning**（实测 `gradle :app:lintDebug`，
#   耗时约 80s）。AGP 默认 `abortOnError=true` 但只对 error 生效，
#   所以 warnings 不会挡合并，同时新增的真正 error 会立刻挡住。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支连续 push 时只跑最后一次，省额度
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble + unit tests
        # --rerun-tasks：不上缓存时也保证测试真的执行过，避免 UP-TO-DATE 假装绿
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest --rerun-tasks

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
