name: Release

# 为什么单独一个 workflow：
# `ci.yml` 只做「构建 + 测试 + 上传 artifact」，产物在 Actions 页面里，
# 手机上点不到（要先登录 GitHub，还得进 run 详情页下载 zip）。
# 这条 workflow 在打 tag 时把 APK 挂到 **Release** 上，于是手机有一个
# 固定不变的下载地址：
#
#   https://github.com/OWNER/REPO/releases/latest/download/dsh-remote-latest.apk
#
# 这个地址永远指向**最新一个** Release 的同名 asset —— 存成书签，以后
# 每次电脑这边 `git push --tags`，手机上刷新一下就下载到新版，不用连电脑、
# 不用开局域网服务。这就是「另一台手机自动收到更新」的最终形态。
#
# 三个设计决定：
#
# 1. **tag 必须与 version.properties 的 versionName 一致**（`v0.2.1` ↔ `0.2.1`）。
#    不一致直接失败 —— 否则 Release 页写着 v0.2.1、包里却是 0.2.0，
#    而 Android 只看 versionCode，出问题时没人能靠版本号对上号。
#
# 2. **签名材料全部走 secrets，缺一个就 fail**。缺 secret 时 build.gradle.kts 会
#    悄悄回落到 debug keystore（甚至因为 runner 上没生成过 debug.keystore 而签不出来，
#    只产出 app-release-unsigned.apk），产物装不上却显示成功。这里先显式检查。
#
# 3. **不注入内置地址**（`dsh.lanUrl` / `dsh.lanPin` 留空）。CI 上没有
#    `local.properties`，BuildConfig 里就是空串，App 一进来要求扫码 ——
#    这正是对的：Release 是公开产物，不能把家里的 IP 和 PIN 打进去。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在且形如 v0.2.1）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # 读取 tag 与实际提交，浅克隆够用，但 fetch-depth: 0 让 `git describe` 之类可用
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # 先看版本号：tag 与 version.properties 必须对得上，否则后面所有工作都白做。
      - name: Read and check version
        id: ver
        run: |
          set -euo pipefail
          code=$(grep -E '^versionCode='  version.properties | cut -d= -f2 | tr -d '[:space:]')
          name=$(grep -E '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error::version.properties 里读不到 versionCode / versionName"
            exit 1
          fi
          # 触发用的 tag：push 事件取 ref_name，手动触发取输入
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "$tag" != "v$name" ]; then
            echo "::error::tag 是 '$tag'，但 version.properties 写的是 versionName=$name。请让两者一致（打 tag 前先 bump 版本）。"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "发布 $name ($code)，tag=$tag"

      # 签名材料检查。缺任何一个都直接失败，不要产出「未签名/用 debug 签的」包。
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少 secret $v"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "::error::签名 secrets 不全，见 README「用 GitHub Release 发版」一节"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # 放在 runner 的临时目录，不进工作区，避免被打进 artifact
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ls -l "$RUNNER_TEMP/release.jks"

      - name: Build release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease \
            -Pdsh.releaseStoreFile="$RUNNER_TEMP/release.jks" \
            -Pdsh.releaseStorePassword="$KEYSTORE_PASSWORD" \
            -Pdsh.releaseKeyAlias="$KEY_ALIAS" \
            -Pdsh.releaseKeyPassword="$KEY_PASSWORD"

      # 装得上才算数：签名缺失 / 用错证书，都会在这里露出来，而不是到手机上才发现。
      - name: Verify APK is signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::没产出 app-release.apk（只有 app-release-unsigned.apk 说明签名没生效）"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          apksigner verify --print-certs "$apk" | tee certs.txt
          # 注意：apksigner 实际输出的前缀是 `V2 Signer: certificate DN:`，不是 `Signer #1 certificate DN`。
          # 写错的话这一步永远失败，而且看起来像「签名没生效」。
          grep -q 'certificate DN' certs.txt

      - name: Rename artifacts
        id: pkg
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/release/app-release.apk
          ver="dsh-remote-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          mkdir -p out
          cp "$src" "out/$ver"
          # 固定名：`releases/latest/download/dsh-remote-latest.apk` 靠它永远指向最新版
          cp "$src" out/dsh-remote-latest.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          ls -l out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DSH 手机遥控 ${{ steps.ver.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            版本 `${{ steps.ver.outputs.name }}`（versionCode ${{ steps.ver.outputs.code }}）

            **手机上收更新**：直接打开下面这个固定地址，下载后覆盖安装即可
            （连接列表不会丢，只有卸载才清）：

            https://github.com/${{ github.repository }}/releases/latest/download/dsh-remote-latest.apk

            其它说明见仓库 README 的「用 GitHub Release 发版」一节。
          files: |
            out/${{ steps.pkg.outputs.ver }}
            out/dsh-remote-latest.apk
            out/SHA256SUMS.txt

      - name: Summary
        run: |
          {
            echo "## 已发布 ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"
            echo ""
            echo "手机端固定下载地址（存成书签）："
            echo ""
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/latest/download/dsh-remote-latest.apk"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
